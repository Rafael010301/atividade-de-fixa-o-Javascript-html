<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Festa de Aniversário</h1>
    <button onclick="adicionarConvidados()">Adicionar Convidado</button>
    <script> 
        let listaConvidados = [];
        alert("Bem Vindo a festa, por favor digite o nome dos convidados");
        function adicionarConvidados(){
            let nome = prompt("Digite o nome do convidado");
            listaConvidados.push(nome);
            let resposta = prompt("Deseja adicionar mais convidados? (sim/não)");
            if(resposta.toLowerCase() == "sim"){
                adicionarConvidados();
            } else {
                console.log("Lista de Convidados:");
                listaConvidados.forEach(function(convidado){
                    console.log(convidado);
                });
            }
        }
    </script>
</body>
</html>
