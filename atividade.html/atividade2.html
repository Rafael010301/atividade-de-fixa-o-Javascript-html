<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Usar guarda-chuva ou não?</h1>
    <p id="meuElemento"></p>

    <script>
        let chuva = true; 

        function editarParagrafo() {
            const elemento = document.getElementById("meuElemento");
            elemento.textContent = (chuva === true) ? "Levar guarda-chuva" : "Deixe o guarda-chuva em casa";
        }

       
        editarParagrafo();
    </script>
</body>
</html>
