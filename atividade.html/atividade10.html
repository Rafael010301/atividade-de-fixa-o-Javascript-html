<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="caixaTexto"></div>
    <script>
        let nomeUsuario = prompt("Escreva seu nome ");
        let cidade = prompt("Qual a sua cidade ?");
        
        const div = document.getElementById("caixaTexto");
        div.textContent = `Ola ${nomeUsuario}, bem vindo à ${cidade}`
    </script>
</body>
</html>
