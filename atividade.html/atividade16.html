<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let codigoResposta = prompt("Digite o código do produto");
        switch(codigoResposta){
            case "A":
                console.log("Produtos Eletrônicos");
                break;
            case "B":
                console.log("Produtos de Limpeza");
                break;
            case "C":
                console.log("Bebidas");
                break;
            default:
                console.log("Código inválido. Por favor, digite um código válido.");
        }
    </script>
</body>
</html>
