<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="tituloCustomizavel">Título incrível</h1>
    <button onclick="trocarCor()">Clique em mim</button>
    <script>
        function trocarCor(){
            const titulo = document.getElementById("tituloCustomizavel").style.color = "blue"
            titulo.innerText = "Texto alterado pelo JS"
        }
    </script>
</body>
</html>
